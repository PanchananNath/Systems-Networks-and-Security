name: Link check

on:
  push:
    paths: ["**/*.md", ".github/workflows/link-check.yml", "lychee.toml"]
  pull_request:
    paths: ["**/*.md"]
  schedule:
    - cron: "0 3 * * 1"   # every Monday 03:00 UTC
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in all Markdown files
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml "./**/*.md"
          fail: true
